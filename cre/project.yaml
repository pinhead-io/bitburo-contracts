# ==========================================================================
# CRE PROJECT SETTINGS FILE
# ==========================================================================
# RPC URLs support ${VAR_NAME} syntax to reference environment variables
# (resolved from .env or the shell), so a paid RPC key never lands in git.
#
# Base mainnet (chain id 8453) is the only chain the Bitburo keeper touches.
# The public endpoint is fine for simulation; for a deployed workflow use a
# paid RPC via ${CRE_SECRET_RPC_BASE}.
# ==========================================================================
staging-settings:
  rpcs:
    - chain-name: ethereum-mainnet-base-1
      url: https://mainnet.base.org

production-settings:
  rpcs:
    - chain-name: ethereum-mainnet-base-1
      url: https://mainnet.base.org
